##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# Pavucontrol floating
windowrule = float on, match:class org.pulseaudio.pavucontrol
windowrule = size 600 600, match:class org.pulseaudio.pavucontrol
windowrule = center on, match:class org.pulseaudio.pavucontrol
windowrule = pin on, match:class org.pulseaudio.pavucontrol

# Blueman Manager
windowrule = float on, match:class blueman-manager
windowrule = size 600 600, match:class blueman-manager
windowrule = center on, match:class blueman-manager

# GNOME Calculator
windowrule = float on, match:class org.gnome.Calculator
windowrule = size 500 500, match:class org.gnome.Calculator
windowrule = center on, match:class org.gnome.Calculator

# Network Manager
windowrule = float on, match:class nm-connection-editor
windowrule = size 600 600, match:class nm-connection-editor
windowrule = center on, match:class nm-connection-editor

# WhatsApp Web (Brave)
windowrule = float on, match:class Brave-browser,match:title WhatsApp Web
windowrule = size 1000 1000, match:class Brave-browser,match:title WhatsApp Web
windowrule = center on, match:class Brave-browser,match:title WhatsApp Web

# VS Code opacity (note: ^ regex needs parens for full match)
windowrule = opacity 0.9, match:class ^(Code)$

# === SwayNC Beautiful Blur + Transparency ===
layerrule = blur on, match:namespace swaync-control-center
layerrule = blur_popups on, match:namespace swaync-control-center
layerrule = ignore_alpha 0, match:namespace swaync-control-center  # or just "ignorezero on" if supported

# Blur nwg-drawer
layerrule = blur on, match:namespace nwg-drawer
